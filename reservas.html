<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas — Portal do Sabiá Maresias</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<div class="topbar">
  <div class="brand">Portal do Sabiá Maresias</div>
  <div class="topbar-right">
    <button class="topbar-btn" onclick="window.location.href='reservas.html'">Reservas</button>
    <button class="topbar-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="topbar-btn" onclick="logout()">Sair</button>
  </div>
</div>

<div class="container">

<h2 class="page-title">Cadastrar / Editar Reserva</h2>

<div class="panel">
  <label>Nome do hóspede</label>
  <input id="nome">

  <label>Entrada</label>
  <input id="entrada" type="date">

  <label>Saída</label>
  <input id="saida" type="date">

  <label>Número do quarto</label>
  <input id="quarto">

  <label>Quantidade de hóspedes</label>
  <input id="hospedes">

  <label>Valor (R$)</label>
  <input id="valor">

  <button id="btnSalvar">Salvar Reserva</button>
</div>

<h2 class="page-title">Reservas Registradas</h2>
<div id="listaReservas"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAFPC12iKSPZ5Y6-YtovvDfku7-EHNjX2s",
  authDomain: "pousadasistemaktz.firebaseapp.com",
  projectId: "pousadasistemaktz",
  storageBucket: "pousadasistemaktz.firebasestorage.app",
  messagingSenderId: "489196675670",
  appId: "1:489196675670:web:f377d0fc784d6552d551f7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let idEdicao = null;

/* ===== LOGIN ===== */
onAuthStateChanged(auth, user => {
  if (!user) location.href = "index.html";
  carregar();
});

/* ===== LOGOUT ===== */
window.logout = () => signOut(auth).then(()=>location.href="index.html");

/* ===== MÁSCARA R$ 1.000,00 ===== */
valor.addEventListener("input", () => {
  let v = valor.value.replace(/\D/g, "");
  if (!v) return valor.value = "";
  v = (v / 100).toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  valor.value = "R$ " + v;
});

/* ===== SALVAR ===== */
btnSalvar.onclick = async () => {
  if (!nome.value || !entrada.value || !saida.value || !quarto.value || !hospedes.value || !valor.value) {
    alert("Preencha todos os campos");
    return;
  }

  const dados = {
    nome: nome.value,
    entrada: entrada.value,
    saida: saida.value,
    quarto: quarto.value,
    hospedes: hospedes.value,
    valor: valor.value,
    userId: auth.currentUser.uid
  };

  if (idEdicao) {
    await updateDoc(doc(db,"reservas",idEdicao), dados);
    idEdicao = null;
  } else {
    await addDoc(collection(db,"reservas"), dados);
  }

  limpar();
  carregar();
};

function limpar(){
  nome.value="";
  entrada.value="";
  saida.value="";
  quarto.value="";
  hospedes.value="";
  valor.value="";
}

/* ===== LISTAR ===== */
async function carregar(){
  listaReservas.innerHTML="";
  const q = query(collection(db,"reservas"), where("userId","==",auth.currentUser.uid));
  const snap = await getDocs(q);

  snap.forEach(d=>{
    const r=d.data();
    listaReservas.innerHTML+=`
      <div class="reserva">
        <strong>${r.nome}</strong><br>
        ${r.entrada} → ${r.saida}<br>
        Quarto ${r.quarto} | ${r.hospedes} hóspedes<br>
        Valor: ${r.valor}<br><br>
        <button class="btn-small editar" onclick='editar("${d.id}", ${JSON.stringify(r)})'>Editar</button>
        <button class="btn-small excluir" onclick="excluir('${d.id}')">Excluir</button>
      </div>`;
  });
}

/* ===== EDITAR ===== */
window.editar=(id,r)=>{
  idEdicao=id;
  nome.value=r.nome;
  entrada.value=r.entrada;
  saida.value=r.saida;
  quarto.value=r.quarto;
  hospedes.value=r.hospedes;
  valor.value=r.valor;
}

/* ===== EXCLUIR ===== */
window.excluir=async id=>{
  if(confirm("Excluir reserva?")){
    await deleteDoc(doc(db,"reservas",id));
    carregar();
  }
}
</script>

</body>
</html>
