<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Portal do Sabiá Maresias</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<!-- ===== HEADER ===== -->

<div class="topbar">
  <div class="brand">Portal do Sabiá Maresias</div>
  <div class="topbar-right">
    <button class="topbar-btn" onclick="window.location.href='reservas.html'">Reservas</button>
    <button class="topbar-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="topbar-btn" onclick="logout()">Sair</button>
  </div>
</div>

<div class="container wide">

<h2 class="page-title">Dashboard da Pousada</h2>

<div class="cards">
  <div class="stat-card">
    <h3>Total de Reservas</h3>
    <p id="totalReservas">0</p>
  </div>

  <div class="stat-card">
    <h3>Total Faturado</h3>
    <p id="totalFaturado">R$ 0,00</p>
  </div>
</div>

<div class="table-box" style="margin-bottom:28px;">
  <h2 class="page-title" style="margin-bottom:14px;">Faturamento por Mês</h2>
  <table id="tabelaMensal">
    <thead>
      <tr>
        <th>Mês</th>
        <th>Reservas</th>
        <th>Faturado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="table-box">
  <button class="btn-export" onclick="exportExcel()">Exportar Excel</button>

  <table id="tabelaReservas">
    <thead>
      <tr>
        <th>Hóspede</th>
        <th>Entrada</th>
        <th>Saída</th>
        <th>Quarto</th>
        <th>Hóspedes</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFPC12iKSPZ5Y6-YtovvDfku7-EHNjX2s",
  authDomain: "pousadasistemaktz.firebaseapp.com",
  projectId: "pousadasistemaktz",
  storageBucket: "pousadasistemaktz.firebasestorage.app",
  messagingSenderId: "489196675670",
  appId: "1:489196675670:web:f377d0fc784d6552d551f7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.logout = () => signOut(auth).then(() => location.href = "index.html");

onAuthStateChanged(auth, async user => {
  if (!user) location.href = "index.html";

  const q = query(collection(db,"reservas"), where("userId","==",user.uid));
  const snap = await getDocs(q);

  let total = 0;
  let faturado = 0;
  let porMes = {}; // agrupa faturamento por mês de check-in (entrada)

  const tbody = document.querySelector("#tabelaReservas tbody");
  tbody.innerHTML = "";

  snap.forEach(d => {
    const r = d.data();
    total++;

    const valorNum = parseFloat(
      r.valor.replace(/[^\d,]/g,"").replace(",",".")
    ) || 0;
    faturado += valorNum;

    tbody.innerHTML += `
      <tr>
        <td>${r.nome}</td>
        <td>${r.entrada}</td>
        <td>${r.saida}</td>
        <td>${r.quarto}</td>
        <td>${r.hospedes}</td>
        <td>${r.valor}</td>
      </tr>
    `;

    if (r.entrada) {
      const chave = r.entrada.slice(0, 7); // "YYYY-MM"
      if (!porMes[chave]) porMes[chave] = { reservas: 0, faturado: 0 };
      porMes[chave].reservas++;
      porMes[chave].faturado += valorNum;
    }
  });

  const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
                       "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const tbodyMensal = document.querySelector("#tabelaMensal tbody");
  tbodyMensal.innerHTML = "";

  Object.keys(porMes).sort().forEach(chave => {
    const [ano, mes] = chave.split("-");
    const nomeMes = nomesMeses[parseInt(mes, 10) - 1] + "/" + ano;
    const dados = porMes[chave];
    tbodyMensal.innerHTML += `
      <tr>
        <td>${nomeMes}</td>
        <td>${dados.reservas}</td>
        <td>R$ ${dados.faturado.toFixed(2).replace(".", ",")}</td>
      </tr>
    `;
  });

  totalReservas.innerText = total;
  totalFaturado.innerText = "R$ " + faturado.toFixed(2).replace(".",",");
});

window.exportExcel = () => {
  const wb = XLSX.utils.table_to_book(
    document.getElementById("tabelaReservas"),
    { sheet: "Reservas" }
  );
  XLSX.writeFile(wb, "dashboard_reservas.xlsx");
};


</script>

</body>
</html>
